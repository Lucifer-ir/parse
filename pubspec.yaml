name: parse_language_academy
description: Parseh Language Academy mobile-first landing screen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_picker: ^10.3.10
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-parse.png
    - assets/images/character.webp
    - assets/images/home_illustration.png
  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-fa.ttf
        - asset: assets/fonts/Estedad-latin.ttf
