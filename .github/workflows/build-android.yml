name: Build Android Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          flutter clean
          flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create signing properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Validate release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore android/app/upload-keystore.jks \
            -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" -srcalias "$KEY_ALIAS" \
            -destkeystore /tmp/parseh-signing-verify.jks \
            -deststoretype JKS -deststorepass verify-pass-123456 \
            -destkeypass verify-pass-123456 -destalias "$KEY_ALIAS" -noprompt >/dev/null

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=debug_symbols --dart-define=PARSE_API_URL=https://api.aiparseh.ir/api

      - name: Build Google Play AAB
        run: flutter build appbundle --release --no-tree-shake-icons --obfuscate --split-debug-info=debug_symbols --dart-define=PARSE_API_URL=https://api.aiparseh.ir/api

      - name: Prepare outputs
        run: |
          rm -rf outputs
          mkdir -p outputs
          cp build/app/outputs/flutter-apk/app-release.apk outputs/parseh-universal-release.apk
          cp build/app/outputs/bundle/release/app-release.aab outputs/parseh-release.aab
          if [ -d debug_symbols ]; then cp -R debug_symbols outputs/debug_symbols; fi
          sha256sum outputs/*.apk outputs/*.aab > outputs/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Parse-${{ github.ref_name }}-android
          path: |
            outputs/parseh-universal-release.apk
            outputs/parseh-release.aab
            outputs/SHA256SUMS.txt
            outputs/debug_symbols/
          retention-days: 14

      - name: Save outputs in repository
        if: github.ref_type == 'branch'
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add outputs/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update Android build outputs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          cp outputs/parseh-universal-release.apk "release-assets/Parse-${GITHUB_REF_NAME}-universal.apk"
          cp outputs/parseh-release.aab "release-assets/Parse-${GITHUB_REF_NAME}.aab"
          if [ -d outputs/debug_symbols ]; then zip -r "release-assets/Parse-${GITHUB_REF_NAME}-debug-symbols.zip" outputs/debug_symbols; fi
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Parse ${GITHUB_REF_NAME}" \
            --generate-notes
