name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          flutter clean
          flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create signing properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Validate release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore android/app/upload-keystore.jks \
            -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" -srcalias "$KEY_ALIAS" \
            -destkeystore /tmp/parseh-signing-verify.jks \
            -deststoretype JKS -deststorepass verify-pass-123456 \
            -destkeypass verify-pass-123456 -destalias "$KEY_ALIAS" -noprompt >/dev/null

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=debug_symbols

      - name: Build Google Play AAB
        run: flutter build appbundle --release --no-tree-shake-icons --obfuscate --split-debug-info=debug_symbols

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Parse-${GITHUB_REF_NAME}-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/Parse-${GITHUB_REF_NAME}.aab
          if [ -d debug_symbols ]; then zip -r release-assets/Parse-${GITHUB_REF_NAME}-debug-symbols.zip debug_symbols; fi
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Parse ${GITHUB_REF_NAME}" \
            --generate-notes
