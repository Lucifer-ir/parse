<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Parse | پنل مدیریت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b1120;color:#e5e7eb}main{max-width:1100px;margin:auto;padding:30px 20px}h1{font-size:25px}p{color:#9ca3af}.card{background:#111827;border:1px solid #263244;border-radius:16px;padding:22px;margin:18px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #374151;background:#0b1120;color:#fff;width:100%;margin:7px 0}button{background:#059669;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#374151}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{font-size:28px;font-weight:bold;margin-top:8px}.hidden{display:none}.small{font-size:12px;color:#9ca3af}.status{white-space:pre-wrap;color:#fca5a5}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.top button{width:auto}.label{font-size:13px;color:#9ca3af}
</style></head><body><main>
<div class="top"><div><h1>Parse — پنل مدیریت</h1><p>فضای مدیریت مستقل از اپلیکیشن دانشجویان</p></div></div>
<section id="login" class="card"><h2>ورود مدیر</h2><label class="label">API Base URL</label><input id="api" placeholder="https://your-api-domain/api" value="https://your-api-domain/api"><label class="label">نام کاربری یا تلفن</label><input id="username" autocomplete="username"><label class="label">رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">ورود</button><div id="loginMsg" class="status"></div><p class="small">این پنل مستقل است. آدرس API را هنگام استقرار به آدرس واقعی سرویس Backend تغییر دهید.</p></section>
<section id="dashboard" class="hidden"><div class="top"><h2>داشبورد</h2><button class="secondary" id="logout">خروج</button></div><div class="grid"><div class="card"><div class="label">شناسه مدیر</div><div class="metric" id="adminName">—</div></div><div class="card"><div class="label">وضعیت سرویس</div><div class="metric" id="service">—</div></div><div class="card"><div class="label">کاربران</div><div class="metric" id="users">—</div></div><div class="card"><div class="label">منابع</div><div class="metric" id="sources">—</div></div><div class="card"><div class="label">سوالات</div><div class="metric" id="questions">—</div></div></div><div class="card"><h3>اتصال پنل</h3><p id="info">—</p><button class="secondary" id="refresh">بروزرسانی</button></div></section>
<script>
const $=id=>document.getElementById(id);let token=null,apiBase='';
async function request(path,options={}){const res=await fetch(apiBase.replace(/\/$/,'')+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.detail||data.message||('HTTP '+res.status));return data}
$('loginBtn').onclick=async()=>{apiBase=$('api').value.trim();$('loginMsg').textContent='';try{const r=await request('/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=r.token;await loadDashboard()}catch(e){$('loginMsg').textContent=e.message}};
async function loadDashboard(){try{const me=await request('/auth/me');if(me.user.role!=='admin'){token=null;throw new Error('این حساب دارای دسترسی مدیر نیست.')}const s=await request('/admin/stats');$('adminName').textContent=me.user.name||me.user.username;$('service').textContent='متصل';$('users').textContent=s.users;$('sources').textContent=s.sources;$('questions').textContent=s.questions;$('info').textContent='پنل مستقل GitHub Pages؛ ارتباط با Backend از طریق API و Bearer token برقرار است.';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}catch(e){$('loginMsg').textContent=e.message;$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}}
$('refresh').onclick=loadDashboard;$('logout').onclick=()=>{token=null;$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
</script></main></body></html>
